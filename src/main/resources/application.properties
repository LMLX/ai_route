spring.application.name=ai-route

# ====== 智能航线 - 因素评分权重配置 ======
# 各风险因素权重（key=因素名, value=权重），用于加权评分，总和无需为 1
route.factor-weights.crowd=0.3
route.factor-weights.temperature=0.2
route.factor-weights.wind=0.4
route.factor-weights.weather=0.3
route.factor-weights.noFly=0.1

# 评分惩罚因子（米）：得分 0 的网格等效额外距离，越大越排斥低分网格
route.score-penalty-factor=200

# 规则不达标时最大重试次数
route.rule-retry-max-times=2

# 网格边长（米），默认 100m
route.grid-size-meters=100

# 浮点舍入保护 epsilon
route.eps=1e-8
